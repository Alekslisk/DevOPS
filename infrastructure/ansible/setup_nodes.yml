- name: Install and Configure K3s Cluster with Keycloak OIDC
  hosts: masters
  become: true
  tasks:
    - name: Clean up unused container images
      command: crictl rmi --prune
      ignore_errors: true

    - name: Install essential packages
      apt:
        name: [nfs-common, curl, htop]
        state: present
        update_cache: yes

    - name: Install K3s Master with Keycloak OIDC integration
      shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
          --kube-apiserver-arg="oidc-issuer-url=http://keycloak.imagegalary.local/realms/imagegalary" \
          --kube-apiserver-arg="oidc-client-id=kubernetes" \
          --kube-apiserver-arg="oidc-username-claim=email" \
          --kube-apiserver-arg="oidc-groups-claim=groups"
      register: k3s_install
      failed_when: k3s_install.rc != 0