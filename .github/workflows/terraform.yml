  name: Deploy Infrastructure (Terraform)

  on:
    push:
      branches:
        - test
        - main
      paths:
        - 'infrastructure/terraform/**'

  jobs:
    terraform-apply:
      runs-on: self-hosted 
      env:
        TF_VAR_minio_access_key: ${{ secrets.MINIO_ACCESS_KEY }}
        TF_VAR_minio_secret_key: ${{ secrets.MINIO_SECRET_KEY }}
        TF_VAR_rancher_token: ${{ secrets.RANCHER_TOKEN }}
        TF_VAR_keycloak_admin_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        TF_VAR_keycloak_secret_key: ${{ secrets.KEYCLOAK_SECRET_KEY }}

      steps:
        - name: Checkout Code
          uses: actions/checkout@v3

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v2

        - name: Terraform Init
          working-directory: infrastructure/terraform
          run: terraform init

        - name: Terraform Plan
          working-directory: infrastructure/terraform
          run: terraform plan

        - name: Terraform Apply
          working-directory: infrastructure/terraform
          run: terraform apply -auto-approve