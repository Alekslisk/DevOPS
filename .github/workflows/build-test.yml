name: Build and Deploy to Test

on:
  push:
    branches:
      - test
    paths-ignore:
      - 'k8s/**'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    environment: AtakuHub
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/imagegalary:$IMAGE_TAG .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/imagegalary:$IMAGE_TAG

      - name: Update Kustomize Image Tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd k8s/overlays/test
          # Утилита kustomize меняет тег на новый
          kustomize edit set image imagegalary=${{ secrets.DOCKERHUB_USERNAME }}/imagegalary:$IMAGE_TAG

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add k8s/overlays/test/kustomization.yaml
          # [skip ci] в сообщении гарантирует, что этот пуш не запустит пайплайн заново
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push