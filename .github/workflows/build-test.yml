name: Build and Deploy to Test

# Запускаем пайплайн только при пуше в твою рабочую ветку
on:
  push:
    branches:
      - feature/k8s-deployment
    # Игнорируем изменения в папке k8s, чтобы бот не запускал пайплайн по кругу
    paths-ignore:
      - 'k8s/**'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      # 2. Логинимся в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Собираем и пушим Docker образ (используем хэш коммита как тег)
      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/imagegalary:$IMAGE_TAG .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/imagegalary:$IMAGE_TAG

      # 4. Обновляем версию образа в манифестах K8s
      - name: Update Kustomize Image Tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd k8s/overlays/test
          # Утилита kustomize меняет тег на новый
          kustomize edit set image твой_логин_dockerhub/imagegalary=${{ secrets.DOCKERHUB_USERNAME }}/imagegalary:$IMAGE_TAG

      # 5. Делаем коммит новых манифестов обратно в Git
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add k8s/overlays/test/kustomization.yaml
          # [skip ci] в сообщении гарантирует, что этот пуш не запустит пайплайн заново
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push